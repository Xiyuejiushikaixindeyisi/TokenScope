'use strict';
const D=JSON.parse(document.getElementById('review-data').textContent),$=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>Number(x).toLocaleString('en-US'),ratio=x=>Number(x.numerator)/Number(x.denominator),pct=x=>(x*100).toLocaleString('zh-CN',{maximumFractionDigits:1})+'%';
let filter='all',backY=0,backCard=null,lastKind='prefix';
const checks={prefix:[['L1 · 前部动态内容','查找前部频繁变化的日期、编号等内容，分析是否打断相同前缀的复用。'],['L2 · 工具排列','查找定义相同、排列顺序不一致的工具列表。'],['L3 · 工具定义','比较工具定义与集合变化，识别可优化的具体内容。'],['L4 · 消息内容差异','对比请求的消息内容；发现即可查看案例，缺少会话关联时不判断历史被改写。'],['L5 · JSON 写法差异','对比部分内容相同、空格等写法不同的工具结果。']],token:[['T1 · 工具定义','检查工具说明与定义的内容，给出适用的精简方案。'],['T2 · 工具返回内容','检查字段和条目，按业务所需内容提出保留方案。'],['T3 · 重复内容','查找同一请求内的重复内容，识别可引用复用或省略的副本。'],['T4 · 历史工具结果','检查较早结果的重复携带，按保留约定给出具体方案。']]};
function metrics(c){if(c.type==='difference')return '<div class="diff-metric"><span>已发现涉及</span><strong>'+fmt(c.n)+'</strong><span>条 / 本场景 '+fmt(c.total)+' 条</span><span class="case-count">'+c.evidence.length+' 个例子</span></div>';
const impact='<div><small>影响请求</small><strong>'+fmt(c.n)+'<em>条</em></strong><span class="explain">本场景 '+fmt(c.total)+' 条中的 '+pct(Number(c.n)/Number(c.total))+'</span></div>';
if(c.kind==='prefix')return '<div class="impact-strip">'+impact+'<div><small>预期命中率提升</small><strong class="good">+'+ratio(c.gain)+'<em>个百分点</em></strong><span class="explain">'+pct(ratio(c.beforeHit))+' → '+pct(ratio(c.afterHit))+'</span></div></div>';
return '<div class="impact-strip three">'+impact+[['p','input_tokens','输入 Token'],['c','compute_tokens','计算 Token']].map(([k,key,label])=>{const x=c.changes[key],v=Number(x.amount);return '<div><small>预期'+label+(v>0?'增加':v<0?'减少':'变化')+'</small><strong class="'+(v>0?'caution':v<0?'good':'')+'">'+(v>0?'+':v<0?'−':'')+fmt(Math.abs(v))+'</strong><span class="explain">'+fmt(c.before[k])+' → '+fmt(c.after[k])+'<br>'+pct(Math.abs(ratio(x.ratio)))+(v>0?' 增加':v<0?' 减少':' 变化')+'</span></div>';}).join('')+'</div>';}
function preview(c){const text=c.preview.length>150?c.preview.slice(0,150)+' …':c.preview;return '<div class="key-evidence"><small>证据片段 · '+esc(c.location)+'</small><code>'+esc(text)+'</code></div>';}
function card(c){return '<article class="solution-card focus-card '+(c.id==='L1'?'featured':'')+'" id="card-'+c.id+'" tabindex="-1" data-card="'+c.id+'"><div class="solution-card-top"><span class="report-type">'+esc(c.category)+'</span><span class="badge '+(c.warning?'warn':'')+'">'+(c.type==='difference'?'差异线索':c.warning?'计算量增加':'建议方案')+'</span></div><h2>'+esc(c.title)+'</h2><p class="solution-description">'+esc(c.desc)+'</p>'+metrics(c)+(c.warning?'<div class="warn-line">输入更短，但计算量增加；该方案不代表计算成本降低。</div>':'')+(c.advice?'<div class="solution-advice"><small>修改方案</small><p>'+esc(c.advice)+'</p></div>':'')+preview(c)+(c.condition?'<p class="condition">'+esc(c.condition)+'</p>':'')+(c.id==='L4'?'<p class="scope-note">仅统计已发现涉及的请求，不表示已穷尽全部差异。</p>':'')+'<div class="solution-card-foot"><small>'+esc(c.scope)+' · 构造样例</small><button class="btn" data-open="'+c.id+'">'+(c.type==='difference'?'查看具体差异':'查看证据与改法')+' →</button></div></article>';}
function pane(label,text,marked=false,omitted=true){return '<div class="evidence-pane"><small>'+esc(label)+'</small><pre class="report-code">'+(marked?text:esc(text))+'</pre>'+(omitted?'<span class="omission">其余请求内容已省略</span>':'')+'</div>';}
function pairEvidence(c){return c.evidence.map((ex,i)=>{function txt(x){if(x.decoded_text!==undefined)return esc(x.decoded_text);return esc(x.context_before||'')+'<mark>'+esc(x.text)+'</mark>'+esc(x.context_after||'');}const a=ex.left.source_ref.request_key.source_record_index,b=ex.right.source_ref.request_key.source_record_index;return '<section class="example-block" data-example="'+(i+1)+'"><div class="example-caption"><strong>例子 '+(i+1)+' · '+esc(c.location)+'</strong><span>仅相关片段</span></div><div class="diff-grid">'+pane('请求 A · 第 '+a+' 条',txt(ex.left),true)+pane('请求 B · 第 '+b+' 条',txt(ex.right),true)+'</div></section>';}).join('');}
function editEvidence(c){return c.edits.map((ex,i)=>{const before=typeof ex.before==='object'?ex.before.text:ex.before,after=typeof ex.after==='object'?ex.after.text:ex.after;let result='<div class="example-caption"><strong>'+esc(c.location)+'</strong><span>单个请求 · 局部示意</span></div><div class="diff-grid before-after">'+pane('修改前',before)+pane('按建议修改后',after)+'</div>';if(c.id==='T3'){result='<div class="related">'+pane('同一请求 · 工具已返回的文档',ex.related_locations[0].excerpt)+'</div>'+result;}return result;}).join('');}
function detail(c){const differences=c.type==='difference';const scopeText=differences?'数量是已发现涉及的不同请求；下面最多展示 3 个例子，例子数量不代表全部影响范围。':'影响请求指采用该方案后原文发生变化的请求。预期变化按本场景全部 '+c.total+' 条请求对比，包含未修改请求。';return '<button class="btn text report-back" data-back>← 返回卡片列表</button><article class="finding-body detail-summary"><span class="report-type">'+esc(c.category)+'</span><div class="detail-top"><h2 tabindex="-1" id="detailTitle">'+esc(c.title)+'</h2></div><p>'+esc(c.desc)+'</p>'+metrics(c)+'<p class="scope-note">'+esc(c.scope)+' · '+esc(scopeText)+'</p>'+(c.warning?'<div class="warn-line">输入减少 2,000 Token，但计算量增加 1,000 Token。两项结果同时保留，请勿将输入减少等同于计算成本降低。</div>':'')+(differences?'<section class="report-section"><h3>具体差异</h3><p class="local-note">请求 A 与请求 B 的内容对照；'+(c.id==='L5'?'直接展示工具返回字符串的解码内容，保留原有空格与数值写法。':'高亮动态内容并保留附近原文。')+'</p>'+pairEvidence(c)+'</section><section class="report-section"><h3>如何理解</h3><p>'+esc(c.note)+'</p></section>':'<section class="report-section"><h3>修改方案</h3><p>'+esc(c.advice)+'</p><p class="condition">'+esc(c.condition)+'</p></section>'+(c.kind==='prefix'?'<section class="report-section"><h3>问题证据 · 请求之间哪里不同</h3><p class="local-note">这是两个请求的原内容对照。</p>'+pairEvidence(c)+'</section>':'')+'<section class="report-section"><h3>'+(c.kind==='prefix'?'建议修改前后':'证据与具体改法')+'</h3><p class="local-note">只展示与本方案有关的字段或片段。</p>'+editEvidence(c)+'</section><section class="report-section"><h3>预期效果说明</h3><p>以上数值来自后端确认的构造样例，用于本次视觉评审，尚非真实编码或回放结果。各方案单独对比，收益不能相加。</p>'+((c.id==='T3'||c.id==='T4')?'<details class="report-detail"><summary>没有可用结果时的展示示例</summary><div class="a-pad"><p>'+(c.id==='T3'?'涉及 12 条请求 · 未评估：工具尚未提供可用的引用协议。保留重复内容证据与修改方向，不填修改后的 Token 数值。':'涉及 60 条请求 · 评估未完成：源内容与预期不一致。本次没有可用的修改后 Token 数值。')+'</p></div></details>':'')+'</section>')+'</article>';}
function state(){const [kind,id]=location.hash.slice(1).split('/');return {kind:kind==='token'?'token':'prefix',id};}
function render(){const {kind,id}=state();if(kind!==lastKind){filter='all';lastKind=kind;}const c=D.cards.find(x=>x.kind===kind&&x.id===id);const rows=D.cards.filter(x=>x.kind===kind&&(filter==='all'||x.id===filter));const title=kind==='prefix'?'低命中率':'Token 异常';const scopeOptions=kind==='prefix'?'<option value="all">低命中 · 3 张代表卡片</option><option value="L1">L1 · 动态内容优化</option><option value="L4">L4 · 消息差异</option><option value="L5">L5 · JSON 写法差异</option>':'<option value="all">Token · T1–T4 代表卡片</option>'+D.cards.filter(x=>x.kind==='token').map(x=>'<option value="'+x.id+'">'+esc(x.category)+'</option>').join('');
$('reportPage').innerHTML='<div class="page-head"><div><h1>业务优化建议</h1><p>先看影响范围与预期变化，再看证据与具体改法</p></div></div><div class="demo-note"><svg class="icon"><use href="#i-info"/></svg><span><strong>UI-04 · 代表卡片视觉稿。</strong> 内容与数值均为构造样例；不同场景独立统计，未连接分析服务。</span></div><section class="report-filters business-scope"><label>卡片样例范围<select id="sampleFilter">'+scopeOptions+'</select></label><div class="review-scope"><span class="field-caption">模型展示</span><strong>GLM-V5.2 · 样式示意</strong></div><div class="scope-window"><small>本轮评审</small><strong>影响范围 · 预期变化 · 证据 · 修改方案</strong><small>统计范围见各卡片 · 无实测报告时间</small></div></section><div class="business-tabs" role="group" aria-label="分析类别"><button data-kind="prefix" class="'+(kind==='prefix'?'active':'')+'" aria-pressed="'+(kind==='prefix')+'">低命中率</button><button data-kind="token" class="'+(kind==='token'?'active':'')+'" aria-pressed="'+(kind==='token')+'">Token 异常</button></div><details class="report-detail" id="detectors"><summary>'+title+'：'+checks[kind].length+' 个探测器 · 查看作用与检查内容</summary><div class="a-pad">'+checks[kind].map(([a,b])=>'<p><strong>'+a+'</strong><br>'+b+'</p>').join('')+'</div></details><div id="businessContent">'+(c?detail(c):kind==='prefix'?((rows.some(x=>x.type==='recommendation')?'<div class="group-title"><div class="label"><h2>优化建议</h2><span>1 项 · 合并同一方案的重复观察</span></div></div><div class="solution-grid low-single" style="grid-template-columns:1fr">'+rows.filter(x=>x.type==='recommendation').map(card).join('')+'</div>':'')+(rows.some(x=>x.type==='difference')?'<div class="group-title"><div class="label"><h2>发现的差异</h2><span>L4 / L5 · 发现即可查看</span></div></div><div class="solution-grid">'+rows.filter(x=>x.type==='difference').map(card).join('')+'</div>':'')):'<div class="group-title"><div class="label"><h2>Token 优化建议</h2><span>'+rows.length+' 项 · 各方案独立对比</span></div></div><div class="solution-grid">'+rows.map(card).join('')+'</div>')+'</div><p class="report-footer">'+(kind==='prefix'?'发现的差异仅说明观察结果 · 每项详情最多 3 个例子':'输入 Token 与计算 Token 分别对比')+' · 只读报告 · 单项收益不可相加</p>';
$('sampleFilter').value=c?c.id:filter;$('sampleFilter').onchange=e=>{filter=e.target.value;if(id){location.hash=kind;}else render();};
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{backCard=null;location.hash=b.dataset.kind;});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{backY=window.scrollY;backCard=b.dataset.open;location.hash=kind+'/'+b.dataset.open;});document.querySelector('[data-back]')?.addEventListener('click',()=>{location.hash=kind;});
