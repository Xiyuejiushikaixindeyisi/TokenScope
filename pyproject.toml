[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tokenscope"
version = "0.1.0.dev6"
description = "Offline token measurement and prefix-cache simulation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "tokenizers==0.23.2",
  "transformers>=5,<6",
  "deepseek-recipe==0.2.0",
  "jinja2>=3.1.6,<4",
]

[project.scripts]
tokenscope = "tokenscope.cli:entrypoint"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokenscope"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tokenscope"]
plugins = ["pydantic.mypy"]
